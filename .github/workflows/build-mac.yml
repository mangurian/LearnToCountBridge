name: Build macOS App

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Match this to your Python version
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Uncomment the next line if you have a requirements file:
        # pip install -r requirements.txt
        
    - name: Package with PyInstaller
      run: |
        # --onefile creates a standalone binary
        # --windowed prevents a background terminal from opening
        pyinstaller --onefile --windowed LearnToCount.py 
        
    - name: Upload Finished Application
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Application
        path: dist/
